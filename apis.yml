name: Sygate
description: 'Sygate Technologies was an endpoint-security software company founded in 1995 in Fremont,
  California, and backed by Trinity Ventures among other investors. Its products included enterprise
  server and end-user firewalls (Sygate Personal Firewall), automated network discovery, network access
  control (NAC), and security monitoring. Symantec acquired Sygate in 2005 for its Universal Network
  Access Control technology; the end-user products were subsequently discontinued and the enterprise NAC
  technology folded into Symantec (now Gen Digital). Sygate is a defunct entity with no active company
  website, developer portal, or public API surface; this profile is retained as a historical
  VC-portfolio lead.'
